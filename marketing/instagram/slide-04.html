<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body {
    position: relative;
    background: #0d0d0d;
    color: #f0f2f5;
    font-family: 'Barlow', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(to right, rgba(240,242,245,0.055) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(240,242,245,0.055) 1px, transparent 1px);
    background-size: 72px 72px;
    -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 35%, black 15%, transparent 75%);
    mask-image: radial-gradient(ellipse 70% 60% at 50% 35%, black 15%, transparent 75%);
  }
  .glow {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 55% 45% at 50% 38%, rgba(249,115,22,0.19), transparent 70%);
  }
  .noise::after {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    opacity: 0.6;
  }
  .pad {
    position: relative; z-index: 2;
    width: 100%; height: 100%;
    padding: 88px;
    display: flex; flex-direction: column;
  }
  .wordmark { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 30px; letter-spacing: -0.02em; }
  .wordmark span { color: #f97316; }
  .center {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
  }
  .eyebrow {
    font-size: 21px; font-weight: 600; letter-spacing: 0.26em;
    text-transform: uppercase; color: #f97316;
  }
  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700; font-size: 94px;
    letter-spacing: -0.04em; line-height: 1.04;
    max-width: 860px;
    margin-top: 40px;
  }
  .sub {
    font-size: 30px; line-height: 1.55;
    color: rgba(240,242,245,0.55);
    max-width: 700px;
    margin-top: 40px;
  }
  .btn {
    display: inline-block;
    margin-top: 60px;
    background: #f97316;
    color: #000;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 31px;
    letter-spacing: -0.01em;
    padding: 32px 64px;
    border-radius: 999px;
    box-shadow: 0 30px 70px -20px rgba(249,115,22,0.5);
  }
  .note { font-size: 24px; color: rgba(240,242,245,0.4); margin-top: 34px; }
  footer {
    border-top: 1px solid rgba(240,242,245,0.12);
    padding-top: 38px;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 23px; color: rgba(240,242,245,0.4);
  }
  footer .idx {
    font-family: 'Space Grotesk', sans-serif;
    letter-spacing: 0.14em; font-variant-numeric: tabular-nums;
    color: rgba(240,242,245,0.35);
  }
</style>
</head>
<body class="noise">
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="pad">
    <header style="display:flex; justify-content:space-between; align-items:center;">
      <div class="wordmark">TRAK<span>.FIT</span></div>
      <div class="idx" style="font-family:'Space Grotesk',sans-serif; letter-spacing:0.14em; font-size:23px; color:rgba(240,242,245,0.35);">04 / 04</div>
    </header>

    <div class="center">
      <div class="eyebrow">Start free</div>
      <h1>Start with your next session.</h1>
      <p class="sub">
        The first workout takes two minutes to log. After that, the record keeps itself.
      </p>
      <span class="btn">Create your free account</span>
      <span class="note">No credit card · link in bio</span>
    </div>

    <footer>
      <span>workouts-logger.vercel.app</span>
      <span class="idx">TRAK.FIT · built for lifters</span>
    </footer>
  </div>
</body>
</html>
