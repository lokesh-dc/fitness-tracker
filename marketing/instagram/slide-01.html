<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body {
    position: relative;
    background: #0d0d0d;
    color: #f0f2f5;
    font-family: 'Barlow', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(to right, rgba(240,242,245,0.055) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(240,242,245,0.055) 1px, transparent 1px);
    background-size: 72px 72px;
    -webkit-mask-image: radial-gradient(ellipse 75% 65% at 50% 0%, black 25%, transparent 75%);
    mask-image: radial-gradient(ellipse 75% 65% at 50% 0%, black 25%, transparent 75%);
  }
  .glow {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 55% 42% at 72% 12%, rgba(249,115,22,0.20), transparent 70%);
  }
  .noise::after {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    opacity: 0.6;
  }
  .pad {
    position: relative; z-index: 2;
    width: 100%; height: 100%;
    padding: 88px;
    display: flex; flex-direction: column;
  }
  .wordmark { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 30px; letter-spacing: -0.02em; }
  .wordmark span { color: #f97316; }
  .label {
    font-size: 21px; font-weight: 600; letter-spacing: 0.24em;
    text-transform: uppercase; color: #f97316;
    display: flex; align-items: center; gap: 20px;
  }
  .label::before { content: ''; width: 68px; height: 2px; background: rgba(249,115,22,0.65); }
  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700; font-size: 104px;
    letter-spacing: -0.04em; line-height: 1.0;
  }
  .sub {
    font-size: 31px; line-height: 1.5;
    color: rgba(240,242,245,0.55);
    max-width: 800px;
  }
  footer {
    border-top: 1px solid rgba(240,242,245,0.12);
    padding-top: 38px;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 23px; color: rgba(240,242,245,0.4);
  }
  footer .idx {
    font-family: 'Space Grotesk', sans-serif;
    letter-spacing: 0.14em; font-variant-numeric: tabular-nums;
    color: rgba(240,242,245,0.35);
  }
</style>
</head>
<body class="noise">
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="pad">
    <header style="display:flex; justify-content:space-between; align-items:center;">
      <div class="wordmark">TRAK<span>.FIT</span></div>
      <div class="label" style="font-size:17px;">Built for the gym floor</div>
    </header>

    <div style="flex:1"></div>

    <div class="label">Strength training log</div>
    <h1 style="margin-top:40px;">Track every set.<br><span style="color:#f97316;">Catch every PR.</span></h1>
    <p class="sub" style="margin-top:40px;">
      A workout log built around progressive overload — plan your blocks,
      log between rests, beat the numbers from last week.
    </p>

    <footer style="margin-top:88px;">
      <span>workouts-logger.vercel.app</span>
      <span class="idx">01 / 04 &nbsp;→</span>
    </footer>
  </div>
</body>
</html>
